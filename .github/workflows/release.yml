# Pipeline de release: compila, testa, empacota o FloppyGames e publica o instalador numa GitHub
# Release.
#
#  - Cada push para o main -> release automática com a versão de <Version> em
#    Directory.Build.props, tal como está nesse commit. Essa versão já vem a subir sozinha a cada
#    commit local (hook .githooks/pre-commit, ver README.md "Desenvolvimento") — nada a fazer aqui
#    além de publicar o que já está no repositório.
#  - Tag vX.Y.Z enviada à mão -> release com exatamente essa versão, ignorando
#    Directory.Build.props (para escolher o número à mão, ex. para saltar de série):
#      git tag v0.2.0  &&  git push origin v0.2.0
#  - Correr à mão (Actions -> Release -> Run workflow) -> só deixa o instalador como artefacto do
#    run, sem criar release.
#
# A versão chega ao instalador e ao rodapé das apps via build.ps1 -Version. As tags criadas por
# este workflow (com o GITHUB_TOKEN) não voltam a disparar o workflow — não há ciclos.

name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, test & package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$props = Get-Content Directory.Build.props
            $version = @($props.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
          }
          Write-Host "Versão: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/FloppyGames.Core.Tests/FloppyGames.Core.Tests.csproj -c Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./src/FloppyGames.Installer/build.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: FloppyGamesSetup-${{ steps.version.outputs.version }}
          path: src/FloppyGames.Installer/Output/FloppyGamesSetup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FloppyGames v${{ steps.version.outputs.version }}
          files: src/FloppyGames.Installer/Output/FloppyGamesSetup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
